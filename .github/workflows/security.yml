name: Security

on:
  push:
    branches: [main, ASE]
  pull_request:
    branches: [main, ASE]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt
          ignore-vulns: |
            # add PYSEC-/GHSA- IDs here with a comment explaining why, if a
            # finding is a false positive or has no available fix yet

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t roadshield:security-scan .
      - name: DEBUG find setuptools copies
        run: docker run --rm roadshield:security-scan sh -c "find / -iname '*setuptools*' -not -path '*/proc/*' 2>/dev/null"
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: roadshield:security-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
