name: CI

on:
  push:
    branches: [main, ASE]
  pull_request:
    branches: [main, ASE]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.14.4
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Sanity check imports
        run: python -c "import torch, torchvision, ultralytics; from sample_utils.model import load_model; from sample_utils.report import estimate_severity; print(torch.__version__, torchvision.__version__)"
      - name: Run tests
        run: |
          set +e
          pytest tests/ -v --tb=short 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            ESCAPED=$(tail -c 3000 pytest_output.txt | awk '{printf "%s%%0A", $0}')
            echo "::error::$ESCAPED"
          fi
          exit $exit_code

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t roadshield:ci .
